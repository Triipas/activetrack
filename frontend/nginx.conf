server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: los nombres de los servicios se resuelven en cada petición,
    # así Nginx sigue funcionando cuando un servicio se recrea con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cronometraje   cronometraje-service:8081;
    set $resultados     resultados-service:8082;
    set $notificaciones notificaciones-service:8083;
    set $inscripciones  inscripciones-service:8084;

    # Servicio de Cronometraje
    location /api/lecturas { proxy_pass http://$cronometraje; }
    location /api/antenas  { proxy_pass http://$cronometraje; }

    # Servicio de Resultados
    location /api/eventos    { proxy_pass http://$resultados; }
    location /api/resultados { proxy_pass http://$resultados; }

    # Servicio de Inscripciones
    location /api/catalogo      { proxy_pass http://$inscripciones; }
    location /api/inscripciones { proxy_pass http://$inscripciones; }
    location /api/pagos         { proxy_pass http://$inscripciones; }
    location /api/admin         { proxy_pass http://$inscripciones; }
    location /api/auth          { proxy_pass http://$inscripciones; }

    # Servicio de Notificaciones (REST + WebSocket)
    location /api/seguimientos { proxy_pass http://$notificaciones; }
    location /api/correos      { proxy_pass http://$notificaciones; }
    location /ws/ {
        proxy_pass http://$notificaciones;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location = /nginx.conf { return 404; }
}
