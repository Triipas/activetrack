server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Servicio de Cronometraje
    location /api/lecturas { proxy_pass http://cronometraje-service:8081; }
    location /api/antenas  { proxy_pass http://cronometraje-service:8081; }

    # Servicio de Resultados
    location /api/eventos    { proxy_pass http://resultados-service:8082; }
    location /api/resultados { proxy_pass http://resultados-service:8082; }

    # Servicio de Notificaciones (REST + WebSocket)
    location /api/seguimientos { proxy_pass http://notificaciones-service:8083; }
    location /ws/ {
        proxy_pass http://notificaciones-service:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location = /nginx.conf { return 404; }
}
