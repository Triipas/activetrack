server:
  port: 8081

spring:
  application:
    name: cronometraje-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activetrack}
    username: ${DB_USER:activetrack}
    password: ${DB_PASSWORD:activetrack}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}

logging:
  level:
    com.activetrack: INFO
