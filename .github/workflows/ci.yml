name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Pruebas unitarias
        run: ./mvnw -B test

      - name: Construir imágenes Docker
        run: docker compose build
