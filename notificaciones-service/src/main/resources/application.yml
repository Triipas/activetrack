server:
  port: 8083

spring:
  application:
    name: notificaciones-service
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false

logging:
  level:
    com.activetrack: INFO
