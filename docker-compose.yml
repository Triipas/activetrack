name: activetrack

x-servicio: &servicio
  restart: unless-stopped
  environment:
    DB_URL: jdbc:postgresql://postgres:5432/activetrack
    DB_USER: activetrack
    DB_PASSWORD: activetrack
    RABBIT_HOST: rabbitmq
    REDIS_HOST: redis
    # Clave compartida para firmar y validar los JWT (cambiarla en producción)
    JWT_SECRET: ${JWT_SECRET:-activetrack-clave-de-desarrollo-cambiar-en-produccion}
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: activetrack
      POSTGRES_USER: activetrack
      POSTGRES_PASSWORD: activetrack
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activetrack -d activetrack"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # consola de administración: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  cronometraje-service:
    <<: *servicio
    build:
      context: .
      args:
        MODULE: cronometraje-service
    ports:
      - "8081:8081"

  resultados-service:
    <<: *servicio
    build:
      context: .
      args:
        MODULE: resultados-service
    ports:
      - "8082:8082"

  notificaciones-service:
    <<: *servicio
    build:
      context: .
      args:
        MODULE: notificaciones-service
    ports:
      - "8083:8083"

  inscripciones-service:
    <<: *servicio
    build:
      context: .
      args:
        MODULE: inscripciones-service
    ports:
      - "8084:8084"

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - cronometraje-service
      - resultados-service
      - notificaciones-service
      - inscripciones-service
