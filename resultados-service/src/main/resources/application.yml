server:
  port: 8082

spring:
  application:
    name: resultados-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activetrack}
    username: ${DB_USER:activetrack}
    password: ${DB_PASSWORD:activetrack}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        # Un mensaje que falla se reintenta 3 veces y luego va a la cola de errores (DLQ).
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms

seguridad:
  jwt:
    secreto: ${JWT_SECRET:activetrack-clave-de-desarrollo-cambiar-en-produccion}

logging:
  level:
    com.activetrack: INFO
